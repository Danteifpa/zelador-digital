name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build e lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      # O código antigo ainda tem avisos de lint conhecidos (ver issue "Zerar os problemas de lint").
      # Enquanto não forem resolvidos, o lint é informativo e não bloqueia o PR.
      - name: Lint
        run: npm run lint
        continue-on-error: true
