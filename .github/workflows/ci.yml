name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Testes, build e lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes automáticos
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Lint
        run: npm run lint -- --max-warnings=0

  banco-e2e:
    name: Banco descartável e testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase local e aplicar todas as migrações
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Testes das regras do banco
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/testes/regras_do_banco.sql

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build apontando para o banco local
        working-directory: frontend
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" npm run build

      - name: Instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        working-directory: frontend
        run: npm run test:e2e

      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: frontend/test-results/
          retention-days: 7
