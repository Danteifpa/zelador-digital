# Configuração do Supabase local (CLI), usada pelo CI para montar um banco descartável
# e aplicar todas as migrações. Produção não usa este arquivo.
project_id = "zelador-digital"

[api]
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://127.0.0.1:4173"
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true

[studio]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[inbucket]
enabled = false
